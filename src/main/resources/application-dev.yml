#database configurations

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5434}/${DB_NAME:docmind}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  # Google Gemini configuration
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:AQ.Ab8RN6LhlrRlEJcZdBfb8kITGP5BAGf1C90ToL66cMdGq4ZS7Q}
        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-3.8-flash}
          temperature: 0.2
        embedding:
          api-key: ${GEMINI_API_KEY:AQ.Ab8RN6LhlrRlEJcZdBfb8kITGP5BAGf1C90ToL66cMdGq4ZS7Q}
          text:
            model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
            task-type: RETRIEVAL_DOCUMENT
            dimensions: 1536
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        # Existing OpenAI vectors must be re-embedded before Gemini search.
        dimensions: 1536
        table-name: vector_store
        schema-name: public
        initialize-schema: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB



#app configurations
app:
  rag:
    chunk-size: 700
#    chunk-overlap: 100
    top-k: 5
    similarity-threshold: 0.0

  cors:
    allowed-origins: "*"
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: "*"


#jwt configurations


jwt:
  secret: ${JWT_SECRET:digiRudranshSagarGupta}
  expiration: 3600000


bootui:
  enabled: ON


logging:
  level:
    org:
      springframework:
        ai:
          chat:
            client:
              advisor: DEBUG
