spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/docmind}
    username: ${DB_USER:docmind}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  ai:
    model:
      chat: bedrock-converse
      embedding: bedrock-titan
    bedrock:
      aws:
        region: ${AWS_REGION}
      converse:
        chat:
          model: ${BEDROCK_CHAT_MODEL:amazon.nova-micro-v1:0}
          temperature: 0.2
          max-tokens: ${BEDROCK_CHAT_MAX_TOKENS:256}
      titan:
        embedding:
          model: ${BEDROCK_EMBEDDING_MODEL:amazon.titan-embed-text-v2:0}
          input-type: text
  vectorstore:
    pgvector:
      index-type: HNSW
      distance-type: COSINE_DISTANCE
      dimensions: 1024
      table-name: vector_store
      schema-name: public
      initialize-schema: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 50MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

server:
  forward-headers-strategy: framework

app:
  rag:
    chunk-size: 700
    top-k: 2
    similarity-threshold: 0.0
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Authorization,Content-Type

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

logging:
  level:
    org.springframework.ai: WARN
    org.hibernate.SQL: WARN
