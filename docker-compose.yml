services:
  backend:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: gemini-prod
      DB_HOST: ${DB_HOST:-aws-0-ap-northeast-2.pooler.supabase.com}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-postgres}
      DB_USER: ${DB_USER:-postgres.sswkuklictlwxpfpizcm}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting the backend}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?Set GEMINI_API_KEY before starting the backend}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET before starting the backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS before starting the backend}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s

  postgres:
    image: pgvector/pgvector:pg16
    container_name: doc-mind-postgres
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: docmind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - ytpgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d docmind" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ytpgdata: